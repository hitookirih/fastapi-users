[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.142.1"
uvicorn = {extras = ["standart"], version = "^0.54.0"}
pydantic = {extras = ["email"], version = "^2.13.5"}
pydantic-settings = "^2.15.0"
sqlalchemy = {version = ">=2.0,<2.1", extras = ["asyncio"]}
asyncpg = "^0.31.0"
alembic = "^1.20.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.5"}
gunicorn = "^26.2.0"
aiohttp = "^3.14.5"
taskiq = "^0.13.0"
taskiq-aio-pika = "^0.6.1"

[dependency-groups]
dev = [
    "black (>=26.10.0,<27.0.0)"
]
